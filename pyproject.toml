[project]
name = "pitch-dataset"
version = "0.1.0"
description = "Complete MLB and MiLB pitch-level Statcast dataset for insights, dashboards, and player evaluations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=6.29.0",
    "jupyter>=1.1.0",
    "matplotlib>=3.9.0",
]

[project.scripts]
pitch-dataset = "pitch_dataset.cli:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
