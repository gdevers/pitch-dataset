name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - reports/situational_selection.html
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync situational demo into docs (standalone share page)
        run: |
          mkdir -p docs
          cp reports/situational_selection.html docs/pitch-selection.html
          touch docs/.nojekyll
          python3 <<'PY'
          from pathlib import Path
          path = Path("docs/pitch-selection.html")
          html = path.read_text(encoding="utf-8")
          # Standalone share URL: no portfolio site-nav / hub banner (same as docs/reports/).
          meta = (
              '  <meta name="description" content="Interactive situational pitch selection: rank pitch type and location by expected xwOBA given count, leverage, and platoon. Free MLB demo on GitHub Pages." />\n'
              '  <meta property="og:title" content="Situational Pitch Selection · pitch-dataset" />\n'
              '  <meta property="og:description" content="Rank pitch type and location by expected xwOBA for pitcher × batter × count. Interactive demo — no install required." />\n'
              '  <meta property="og:type" content="website" />\n'
              '  <meta property="og:url" content="https://gdevers.github.io/pitch-dataset/pitch-selection.html" />\n'
          )
          if 'property="og:title"' not in html:
              html = html.replace(
                  "  <title>Situational Pitch Selection</title>\n",
                  "  <title>Situational Pitch Selection</title>\n" + meta,
              )
          path.write_text(html, encoding="utf-8")
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
